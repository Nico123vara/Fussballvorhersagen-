version: "3.9"

services:
  db:
    image: postgres:16
    container_name: fussball_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fussball
      POSTGRES_PASSWORD: fussball_pw
      POSTGRES_DB: fussball
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
